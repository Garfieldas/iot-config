{% extends "base.html" %}
{% block content %}
<main class="app-shell">
    <aside class="sidebar">
        <div class="brand">
            <span class="brand-mark">8</span>
            <span>GP<span class="brand-dot">.</span></span>
        </div>
        <div class="side-label">Workspace</div>
        <nav>
            <a class="nav-item active" href="/">
                <span class="nav-icon">⌁</span>
                Overview
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="status-pip"></div>
            <div>
                <strong>Live connection</strong>
                <span>PostgreSQL sensor feed</span>
            </div>
        </div>
    </aside>

    <section class="content">
        <header class="topbar">
            <div>
                <p class="eyebrow">Environmental telemetry</p>
                <h1>Good evening, <span>dashboard.</span></h1>
                <p class="subtitle">A calm view of today’s conditions, updated automatically.</p>
            </div>
            <div class="today-badge">
                <span class="calendar-icon">□</span>
                <div>
                    <small>TODAY</small>
                    <strong id="today-label">Loading…</strong>
                </div>
            </div>
        </header>

        <div
            id="dashboard-data"
            hx-get="{{ url_for('dashboard_data', interval='6h') }}"
            hx-trigger="load, every 30s"
            hx-swap="innerHTML"
            hx-indicator="#refresh-indicator"
        >
            <div class="loading-state">Loading today’s measurements…</div>
        </div>
    </section>
</main>
{% endblock %}
